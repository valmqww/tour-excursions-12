<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Організація туристичних екскурсій</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f7f6;
            color: #2c3e50;
        }
        .container {
            background-color: #ffffff;
            padding: 20px 25px;
            border-radius: 8px;
            max-width: 480px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .result {
            font-weight: bold;
            color: #1e8449;
            margin-top: 15px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>Розрахунок вартості туристичної екскурсії</h3>
        <p>Оглядова екскурсія «Історичний Київ» (2 дорослих × 350 грн): <strong>700 грн</strong></p>
        <p>Оренда аудіогіда (2 шт. × 80 грн): <strong>160 грн</strong></p>
        <p class="result" id="total"></p>
    </div>

    <script>
        let tourPrice = 700;
        let audioGuidePrice = 160;
        let total = tourPrice + audioGuidePrice;

        alert("Загальна вартість туристичної екскурсії: " + total + " грн");
        document.getElementById("total").textContent =
            "Загальна сума до сплати: " + total + " грн";
    </script>
</body>
</html>
